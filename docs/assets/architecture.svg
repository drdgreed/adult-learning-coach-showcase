<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="860" height="640" rx="14" fill="#111318"/>
  <text x="430" y="40" text-anchor="middle" fill="#e6e8ec" font-size="20" font-weight="700">ALCA — Adult Learning Coaching Agent</text>
  <text x="430" y="62" text-anchor="middle" fill="#8b93a1" font-size="13">Video in → evidence-based coaching report out</text>

  <!-- Actor -->
  <g>
    <rect x="40" y="110" width="150" height="170" rx="10" fill="#1b2230" stroke="#2f3a4d"/>
    <text x="115" y="135" text-anchor="middle" fill="#9fb4d6" font-size="13" font-weight="700">Users</text>
    <text x="115" y="162" text-anchor="middle" fill="#cdd5e0" font-size="12">Instructor</text>
    <text x="115" y="184" text-anchor="middle" fill="#cdd5e0" font-size="12">Coach</text>
    <text x="115" y="206" text-anchor="middle" fill="#cdd5e0" font-size="12">Program admin</text>
    <text x="115" y="240" text-anchor="middle" fill="#6f7888" font-size="10.5">uploads a teaching</text>
    <text x="115" y="255" text-anchor="middle" fill="#6f7888" font-size="10.5">session video</text>
  </g>

  <!-- Frontend -->
  <g>
    <rect x="220" y="92" width="200" height="206" rx="10" fill="#152033" stroke="#3a567f"/>
    <text x="320" y="116" text-anchor="middle" fill="#61dafb" font-size="13" font-weight="700">Frontend</text>
    <text x="320" y="134" text-anchor="middle" fill="#7f8da0" font-size="10.5">React 19 · TypeScript · MUI</text>
    <text x="320" y="149" text-anchor="middle" fill="#7f8da0" font-size="10.5">React Query · React Router</text>
    <line x1="236" y1="160" x2="404" y2="160" stroke="#2b3a52"/>
    <text x="320" y="180" text-anchor="middle" fill="#cdd5e0" font-size="11">Dashboard</text>
    <text x="320" y="199" text-anchor="middle" fill="#cdd5e0" font-size="11">Upload</text>
    <text x="320" y="218" text-anchor="middle" fill="#cdd5e0" font-size="11">EvaluationDetail</text>
    <text x="320" y="237" text-anchor="middle" fill="#cdd5e0" font-size="11">ComparisonCreate</text>
    <text x="320" y="256" text-anchor="middle" fill="#cdd5e0" font-size="11">ComparisonDetail</text>
    <text x="320" y="282" text-anchor="middle" fill="#6f7888" font-size="10">Axios → /api/v1</text>
  </g>

  <!-- Backend -->
  <g>
    <rect x="450" y="92" width="220" height="320" rx="10" fill="#13251f" stroke="#2f5d4a"/>
    <text x="560" y="116" text-anchor="middle" fill="#5fe3a1" font-size="13" font-weight="700">FastAPI Backend</text>
    <text x="560" y="134" text-anchor="middle" fill="#7f8da0" font-size="10.5">Python 3.11 · async · OpenAPI</text>

    <rect x="466" y="148" width="188" height="74" rx="7" fill="#16312a" stroke="#2f5d4a"/>
    <text x="560" y="166" text-anchor="middle" fill="#bfe9d6" font-size="11" font-weight="600">Routers (20 endpoints)</text>
    <text x="560" y="184" text-anchor="middle" fill="#9fb8ac" font-size="10">videos · evaluations</text>
    <text x="560" y="199" text-anchor="middle" fill="#9fb8ac" font-size="10">instructors · comparisons</text>
    <text x="560" y="214" text-anchor="middle" fill="#9fb8ac" font-size="10">background pipeline (async)</text>

    <rect x="466" y="232" width="188" height="100" rx="7" fill="#16312a" stroke="#2f5d4a"/>
    <text x="560" y="250" text-anchor="middle" fill="#bfe9d6" font-size="11" font-weight="600">Services</text>
    <text x="560" y="268" text-anchor="middle" fill="#9fb8ac" font-size="10">transcription · analysis</text>
    <text x="560" y="283" text-anchor="middle" fill="#9fb8ac" font-size="10">comparison_analysis</text>
    <text x="560" y="298" text-anchor="middle" fill="#9fb8ac" font-size="10">pdf_report · prompts</text>
    <text x="560" y="313" text-anchor="middle" fill="#9fb8ac" font-size="10">storage · evaluation</text>

    <rect x="466" y="342" width="188" height="56" rx="7" fill="#16312a" stroke="#2f5d4a"/>
    <text x="560" y="361" text-anchor="middle" fill="#bfe9d6" font-size="11" font-weight="600">Data layer</text>
    <text x="560" y="379" text-anchor="middle" fill="#9fb8ac" font-size="10">SQLAlchemy 2.0 (async)</text>
    <text x="560" y="392" text-anchor="middle" fill="#9fb8ac" font-size="10">7 models · JSONB metrics</text>
  </g>

  <!-- External services -->
  <g>
    <rect x="700" y="110" width="124" height="62" rx="8" fill="#2a2140" stroke="#4b3d73"/>
    <text x="762" y="133" text-anchor="middle" fill="#c4b5f0" font-size="11" font-weight="600">AssemblyAI</text>
    <text x="762" y="150" text-anchor="middle" fill="#9a8fc0" font-size="9.5">transcription +</text>
    <text x="762" y="162" text-anchor="middle" fill="#9a8fc0" font-size="9.5">speaker diarization</text>

    <rect x="700" y="186" width="124" height="62" rx="8" fill="#2a2140" stroke="#4b3d73"/>
    <text x="762" y="209" text-anchor="middle" fill="#c4b5f0" font-size="11" font-weight="600">Claude API</text>
    <text x="762" y="226" text-anchor="middle" fill="#9a8fc0" font-size="9.5">4-dimension analysis</text>
    <text x="762" y="238" text-anchor="middle" fill="#9a8fc0" font-size="9.5">temp 0.3 · 200K ctx</text>

    <rect x="700" y="262" width="124" height="56" rx="8" fill="#2a2140" stroke="#4b3d73"/>
    <text x="762" y="284" text-anchor="middle" fill="#c4b5f0" font-size="11" font-weight="600">ReportLab</text>
    <text x="762" y="301" text-anchor="middle" fill="#9a8fc0" font-size="9.5">PDF coaching report</text>
  </g>

  <!-- Data stores -->
  <g>
    <rect x="450" y="440" width="105" height="64" rx="8" fill="#1b2230" stroke="#33608f"/>
    <text x="502" y="466" text-anchor="middle" fill="#8fb6e0" font-size="11" font-weight="600">PostgreSQL</text>
    <text x="502" y="484" text-anchor="middle" fill="#7f8da0" font-size="9.5">videos · transcripts</text>
    <text x="502" y="496" text-anchor="middle" fill="#7f8da0" font-size="9.5">evaluations · comparisons</text>

    <rect x="565" y="440" width="105" height="64" rx="8" fill="#1b2230" stroke="#33608f"/>
    <text x="617" y="466" text-anchor="middle" fill="#8fb6e0" font-size="11" font-weight="600">Object store</text>
    <text x="617" y="484" text-anchor="middle" fill="#7f8da0" font-size="9.5">local FS (MVP)</text>
    <text x="617" y="496" text-anchor="middle" fill="#7f8da0" font-size="9.5">S3 (optional)</text>
  </g>

  <!-- Pipeline strip -->
  <g>
    <rect x="40" y="540" width="784" height="74" rx="10" fill="#181c24" stroke="#2f3a4d"/>
    <text x="60" y="564" fill="#8b93a1" font-size="11" font-weight="700">PIPELINE</text>
    <text x="60" y="592" fill="#cdd5e0" font-size="12">Upload  →  Transcribe (AssemblyAI)  →  Analyze 4 dimensions (Claude)  →  Render PDF (ReportLab)  →  Track trends &amp; compare 2–10 sessions</text>
    <text x="60" y="607" fill="#6f7888" font-size="10">Every observation cites a timestamp in the transcript. Comparisons analyze evaluation reports, not raw transcripts, to stay within token budget.</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a6a82"/>
    </marker>
  </defs>
  <line x1="190" y1="195" x2="216" y2="195" stroke="#5a6a82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="420" y1="185" x2="446" y2="185" stroke="#5a6a82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="670" y1="170" x2="696" y2="150" stroke="#5a6a82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="670" y1="240" x2="696" y2="220" stroke="#5a6a82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="670" y1="300" x2="696" y2="290" stroke="#5a6a82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="540" y1="412" x2="515" y2="436" stroke="#5a6a82" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="412" x2="605" y2="436" stroke="#5a6a82" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
